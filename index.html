<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<meta name="theme-color" content="#0f0f0f"/>
<title>Расходы</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f0f;--bg2:#1a1a1a;--bg3:#222;--bg4:#2a2a2a;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --text:#f0f0f0;--muted:#888;--subtle:#555;
  --danger:#e05252;--danger-bg:rgba(224,82,82,0.12);
  --green:#4caf7d;--green-bg:rgba(76,175,125,0.12);
  --orange:#e8923a;--blue:#5b9cf6;
  --r:12px;--rs:8px;--rxs:6px;
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;padding-bottom:5rem}
#app{max-width:480px;margin:0 auto;padding:0 1rem}

/* ── TABS ── */
.tabs{display:flex;background:var(--bg2);border-radius:var(--r);padding:4px;margin:1rem 0;border:0.5px solid var(--border)}
.tab{flex:1;height:36px;border:none;background:transparent;color:var(--muted);font-size:14px;font-weight:500;cursor:pointer;border-radius:var(--rs);font-family:inherit;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:5px}
.tab.active{background:var(--bg4);color:var(--text)}
.screen{display:none}.screen.active{display:block}

/* ── TOTAL CARD ── */
.total-card{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--r);padding:1.25rem 1.5rem;margin-bottom:.75rem}
.total-row{display:flex;justify-content:space-between;align-items:flex-start}
.total-label{font-size:11px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin-bottom:4px}
.total-big{font-size:34px;font-weight:600;letter-spacing:-.5px;line-height:1}
.total-cur{font-size:17px;color:var(--muted);font-weight:400}
.total-count{font-size:12px;color:var(--muted);text-align:right}
.budget-bar-wrap{margin-top:12px}
.budget-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:5px}
.budget-bar-bg{height:4px;background:var(--bg3);border-radius:2px;overflow:hidden}
.budget-bar-fill{height:100%;border-radius:2px;transition:width .3s}
.budget-set-row{display:flex;align-items:center;gap:8px;margin-top:10px}
.budget-inp{flex:1;height:34px;background:var(--bg3);border:0.5px solid var(--border2);border-radius:var(--rxs);color:var(--text);font-size:14px;padding:0 10px;outline:none;font-family:inherit}
.btn-sm{height:34px;padding:0 12px;font-size:13px;background:var(--bg4);color:var(--text);border:0.5px solid var(--border2);border-radius:var(--rxs);cursor:pointer;font-family:inherit;white-space:nowrap}
.btn-sm:active{opacity:.7}

/* ── ADD FORM ── */
.add-form{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--r);padding:1rem;margin-bottom:.75rem;display:flex;flex-direction:column;gap:8px}
.cats{display:flex;gap:6px;flex-wrap:wrap}
.cat-btn{height:30px;padding:0 10px;border-radius:20px;border:0.5px solid var(--border2);background:transparent;color:var(--muted);font-size:12px;cursor:pointer;font-family:inherit;transition:all .13s;white-space:nowrap}
.cat-btn.selected{border-color:var(--blue);color:var(--blue);background:rgba(91,156,246,.1)}
.form-row{display:flex;gap:6px;align-items:center}
input[type=text],input[type=number]{background:var(--bg3);border:0.5px solid var(--border2);border-radius:var(--rs);color:var(--text);font-size:16px;padding:0 12px;height:46px;outline:none;width:100%;font-family:inherit;-webkit-appearance:none}
input::placeholder{color:var(--subtle)}
input:focus{border-color:rgba(255,255,255,.28)}
.inp-qty{width:42px;min-width:42px;max-width: 130px;flex-shrink:0;text-align:center;padding:0 4px}
.qty-sep{color:var(--muted);font-size:14px;flex-shrink:0;user-select:none;margin:0 2px}
.inp-price{min-width:0;max-width: 130px;flex:1}
.btn-add{height:46px;padding:0 16px;background:var(--text);color:var(--bg);border:none;border-radius:var(--rs);font-size:15px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit;flex-shrink:0;-webkit-tap-highlight-color:transparent}
.btn-add:active{opacity:.75}

/* ── ITEMS ── */
.section-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px;padding:0 2px}
.items-list{display:flex;flex-direction:column;gap:5px}
.item-card{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--rs);padding:10px 12px;display:flex;align-items:center;gap:8px;animation:sli .15s ease}
@keyframes sli{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
.item-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.item-info{flex:1;min-width:0}
.item-name{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-sub{font-size:11px;color:var(--muted);margin-top:2px}
.item-right{display:flex;flex-direction:column;align-items:flex-end;flex-shrink:0;gap:2px}
.item-total{font-size:15px;font-weight:500;white-space:nowrap}
.item-cur{font-size:11px;color:var(--muted);margin-left:1px}
.item-cat-tag{font-size:10px;color:var(--muted);border:0.5px solid var(--border);border-radius:4px;padding:1px 5px;white-space:nowrap}
.btn-del{width:30px;height:30px;border:none;background:transparent;color:var(--subtle);cursor:pointer;border-radius:5px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px;-webkit-tap-highlight-color:transparent}
.btn-del:active{background:var(--danger-bg);color:var(--danger)}

.empty{text-align:center;padding:3rem 1rem;color:var(--muted);font-size:14px}
.empty-icon{font-size:38px;margin-bottom:10px;opacity:.35}

.list-footer{display:flex;gap:8px;margin-top:1rem;justify-content:flex-end}
.btn-save{height:40px;padding:0 18px;font-size:14px;font-weight:500;background:var(--green-bg);color:var(--green);border:0.5px solid rgba(76,175,125,.35);border-radius:var(--rs);cursor:pointer;font-family:inherit}
.btn-save:active{opacity:.75}
.btn-clear{height:40px;padding:0 14px;font-size:13px;color:var(--danger);background:transparent;border:0.5px solid rgba(224,82,82,.3);border-radius:var(--rs);cursor:pointer;font-family:inherit}
.btn-clear:active{background:var(--danger-bg)}

/* ── MODAL ── */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;align-items:flex-end;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:var(--bg2);border:0.5px solid var(--border2);border-radius:var(--r) var(--r) 0 0;padding:1.5rem 1.25rem 2.5rem;width:100%;max-width:480px;animation:slideUp .2s ease}
@keyframes slideUp{from{transform:translateY(60px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-title{font-size:16px;font-weight:600;margin-bottom:4px}
.modal-sub{font-size:13px;color:var(--muted);margin-bottom:1rem}
.modal input{width:100%;margin-bottom:10px}
.modal-btns{display:flex;gap:8px;margin-top:4px}
.btn-confirm{flex:1;height:46px;background:var(--text);color:var(--bg);border:none;border-radius:var(--rs);font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-cancel{height:46px;padding:0 18px;background:transparent;color:var(--muted);border:0.5px solid var(--border2);border-radius:var(--rs);font-size:15px;cursor:pointer;font-family:inherit}

/* ── HISTORY ── */
.stats-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:.75rem}
.stat-card{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--r);padding:1rem 1.1rem}
.stat-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.stat-val{font-size:22px;font-weight:600}
.stat-sub{font-size:11px;color:var(--muted);margin-top:2px}

.history-actions{display:flex;gap:8px;margin-bottom:.75rem}
.btn-export{flex:1;height:38px;font-size:13px;background:var(--bg2);color:var(--text);border:0.5px solid var(--border2);border-radius:var(--rs);cursor:pointer;font-family:inherit}
.btn-export:active{opacity:.7}
.btn-import-wrap{position:relative;flex:1}
.btn-import-wrap input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.btn-import{width:100%;height:38px;font-size:13px;background:var(--bg2);color:var(--text);border:0.5px solid var(--border2);border-radius:var(--rs);cursor:pointer;font-family:inherit;pointer-events:none}
.db-badge{text-align:center;font-size:11px;color:var(--subtle);margin-bottom:.75rem;padding:6px;background:var(--bg2);border-radius:var(--rxs);border:0.5px solid var(--border)}

.receipt-card{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--r);margin-bottom:8px;overflow:hidden}
.receipt-head{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.receipt-head:active{background:var(--bg3)}
.receipt-icon{font-size:20px;flex-shrink:0}
.receipt-info{flex:1;min-width:0}
.receipt-name{font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.receipt-meta{font-size:11px;color:var(--muted);margin-top:2px}
.receipt-total{font-size:15px;font-weight:600;white-space:nowrap;margin-right:4px}
.receipt-arrow{color:var(--subtle);font-size:12px;transition:transform .2s;flex-shrink:0}
.receipt-arrow.open{transform:rotate(180deg)}
.receipt-body{display:none;border-top:0.5px solid var(--border);padding:10px 14px 12px}
.receipt-body.open{display:block}
.receipt-note{font-size:12px;color:var(--muted);margin-bottom:10px;font-style:italic;padding:6px 8px;background:var(--bg3);border-radius:var(--rxs)}
.r-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:0.5px solid var(--border)}
.r-item:last-child{border-bottom:none}
.r-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.r-info{flex:1;min-width:0}
.r-name{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-qty-line{font-size:11px;color:var(--muted);margin-top:1px}
.r-cat{font-size:10px;color:var(--muted);border:0.5px solid var(--border);border-radius:4px;padding:1px 5px;flex-shrink:0}
.r-price{font-size:14px;font-weight:500;white-space:nowrap;flex-shrink:0}
.r-cur{font-size:10px;color:var(--muted)}

/* cat breakdown */
.cat-breakdown{margin-top:10px;padding-top:10px;border-top:0.5px solid var(--border)}
.cat-breakdown-title{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.cat-row{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.cat-row-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.cat-row-name{font-size:12px;color:var(--muted);flex:1}
.cat-row-bar-bg{flex:2;height:3px;background:var(--bg3);border-radius:2px;overflow:hidden}
.cat-row-bar{height:100%;border-radius:2px}
.cat-row-val{font-size:12px;font-weight:500;white-space:nowrap;min-width:50px;text-align:right}

.receipt-actions{display:flex;justify-content:flex-end;margin-top:10px}
.btn-receipt-del{height:32px;padding:0 12px;font-size:12px;color:var(--danger);background:transparent;border:0.5px solid rgba(224,82,82,.3);border-radius:var(--rxs);cursor:pointer;font-family:inherit}
.btn-receipt-del:active{background:var(--danger-bg)}
.no-history{text-align:center;padding:3rem 1rem;color:var(--muted);font-size:14px}

.toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg4);color:var(--text);border:0.5px solid var(--border2);border-radius:var(--rs);padding:10px 20px;font-size:14px;opacity:0;transition:all .25s;pointer-events:none;z-index:200;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app">
  <div class="tabs">
    <button class="tab active" onclick="switchTab('list')" id="tab-list">🛒 Список</button>
    <button class="tab" onclick="switchTab('history')" id="tab-history">📋 История</button>
  </div>

  <!-- ── LIST ── -->
  <div class="screen active" id="screen-list">
    <div class="total-card">
      <div class="total-row">
        <div>
          <div class="total-label">Текущий список</div>
          <div>
            <span class="total-big" id="total-val">0.00</span>
            <span class="total-cur"> ₴</span>
          </div>
        </div>
        <div>
          <div class="total-count" id="total-count">0 позиций</div>
          <div id="budget-left-badge" style="font-size:12px;text-align:right;margin-top:4px"></div>
        </div>
      </div>
      <div class="budget-bar-wrap" id="budget-wrap" style="display:none">
        <div class="budget-meta">
          <span>Бюджет</span>
          <span id="budget-meta-text"></span>
        </div>
        <div class="budget-bar-bg">
          <div class="budget-bar-fill" id="budget-bar" style="width:0%"></div>
        </div>
      </div>
      <div class="budget-set-row">
        <input type="number" class="budget-inp" id="budget-inp" placeholder="Установить бюджет ₴" inputmode="decimal" min="0"/>
        <button class="btn-sm" onclick="setBudget()">Задать</button>
        <button class="btn-sm" id="budget-clear-btn" onclick="clearBudget()" style="display:none;color:var(--muted)">✕</button>
      </div>
    </div>

    <div class="add-form">
		<div class="cats" id="cats-row"></div>
		<div class="form-row">
    <input type="text" id="inp-name" placeholder="Название товара" maxlength="60" autocomplete="off" autocorrect="off"/>
  </div>
  <div class="form-row">
    <input type="number" id="inp-qty" class="inp-qty" value="1" min="1" step="1" inputmode="numeric" title="Количество"/>
    <span class="qty-sep">×</span>
    <input type="number" id="inp-price" class="inp-price" placeholder="Цена ₴" min="0" step="0.01" inputmode="decimal"/>
    <button class="btn-add" onclick="addItem()">+ Добавить</button>
  </div>
</div>

    <div class="section-label" id="list-label" style="display:none">Список покупок</div>
    <div class="items-list" id="items-list"></div>
    <div class="list-footer" id="list-footer" style="display:none">
      <button class="btn-clear" onclick="clearAll()">🗑 Сбросить</button>
      <button class="btn-save" onclick="openSaveModal()">💾 Сохранить чек</button>
    </div>
  </div>

  <!-- ── HISTORY ── -->
  <div class="screen" id="screen-history">
    <div class="stats-row" id="stats-row"></div>
    <div class="history-actions">
      <button class="btn-export" onclick="exportJSON()">⬇ Экспорт JSON</button>
      <div class="btn-import-wrap">
        <button class="btn-import">⬆ Импорт JSON</button>
        <input type="file" accept=".json" onchange="importJSON(event)"/>
      </div>
    </div>
    <div class="db-badge" id="db-badge">📦 IndexedDB — история хранится в базе браузера</div>
    <div class="section-label">Сохранённые чеки</div>
    <div id="history-list"></div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-bg" id="modal-bg" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-title">Сохранить чек</div>
    <div class="modal-sub" id="modal-sub"></div>
    <input type="text" id="modal-label" placeholder='Название: "АТБ, 9 мая"' maxlength="60" autocomplete="off"/>
    <input type="text" id="modal-note" placeholder='Заметка (необязательно)' maxlength="120" autocomplete="off"/>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModalDirect()">Отмена</button>
      <button class="btn-confirm" onclick="saveReceipt()">Сохранить</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ════════════════════════════════════════
   IndexedDB
════════════════════════════════════════ */
const DB_NAME = 'expenses_db';
const DB_VER  = 1;
let db = null;

function openDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('receipts'))
        d.createObjectStore('receipts', {keyPath:'id'});
    };
    req.onsuccess = e => { db = e.target.result; res(); };
    req.onerror   = e => rej(e);
  });
}

function dbGetAll() {
  return new Promise((res, rej) => {
    const req = db.transaction('receipts','readonly').objectStore('receipts').getAll();
    req.onsuccess = () => res(req.result.sort((a,b)=>b.id-a.id));
    req.onerror   = e => rej(e);
  });
}
function dbAdd(r) {
  return new Promise((res, rej) => {
    const req = db.transaction('receipts','readwrite').objectStore('receipts').add(r);
    req.onsuccess = () => res();
    req.onerror   = e => rej(e);
  });
}
function dbDel(id) {
  return new Promise((res, rej) => {
    const req = db.transaction('receipts','readwrite').objectStore('receipts').delete(id);
    req.onsuccess = () => res();
    req.onerror   = e => rej(e);
  });
}
function dbPut(r) {
  return new Promise((res, rej) => {
    const req = db.transaction('receipts','readwrite').objectStore('receipts').put(r);
    req.onsuccess = () => res();
    req.onerror   = e => rej(e);
  });
}

/* ════════════════════════════════════════
   State
════════════════════════════════════════ */
const SK_ITEMS  = 'exp_items';
const SK_BUDGET = 'exp_budget';
const CATS = [
  {id:'food',      label:'🍞 Еда',        color:'#5b9cf6'},
  {id:'transport', label:'🚌 Транспорт',   color:'#e8923a'},
  {id:'build',     label:'🔨 Стройка',     color:'#c97bff'},
  {id:'medicine',  label:'💊 Лекарство',         color:'#4caf7d'},
  {id:'other',     label:'💬 Другое',      color:'#888'},
  {id:'igoryn',    label:'🗿 Игорян',      color:'#4caf77'},
  {id:'management',    label:'📈 Начальство',      color:'#FFA500'},
  {id:'ivan',    label:'🚊 Создатель',      color:'#9C00FF'},
];

let items  = lsGet(SK_ITEMS,  []);
let budget = lsGet(SK_BUDGET, null);
let selCat = null;

function lsGet(k,d){try{const r=localStorage.getItem(k);return r?JSON.parse(r):d;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

function catColor(id){return(CATS.find(c=>c.id===id)||CATS[4]).color;}
function catLabel(id){return(CATS.find(c=>c.id===id)||CATS[4]).label;}
function catShort(id){const p=catLabel(id).split(' ');return p.slice(1).join(' ')||p[0];}

/* ════════════════════════════════════════
   Tabs
════════════════════════════════════════ */
function switchTab(t) {
  document.querySelectorAll('.tab').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.screen').forEach(el=>el.classList.remove('active'));
  document.getElementById('tab-'+t).classList.add('active');
  document.getElementById('screen-'+t).classList.add('active');
  if (t==='history') renderHistory();
}

/* ════════════════════════════════════════
   Categories
════════════════════════════════════════ */
function renderCats() {
  document.getElementById('cats-row').innerHTML = CATS.map(c=>
    `<button class="cat-btn${selCat===c.id?' selected':''}" onclick="selectCat('${c.id}')">${c.label}</button>`
  ).join('');
}
function selectCat(id){selCat=(selCat===id)?null:id;renderCats();}

/* ════════════════════════════════════════
   Budget
════════════════════════════════════════ */
function setBudget(){
  const v=parseFloat(document.getElementById('budget-inp').value);
  if(isNaN(v)||v<=0)return;
  budget=v;lsSet(SK_BUDGET,budget);
  document.getElementById('budget-inp').value='';
  renderList();
}
function clearBudget(){budget=null;lsSet(SK_BUDGET,null);renderList();}

/* ════════════════════════════════════════
   Add / Delete
════════════════════════════════════════ */
function addItem(){
  const nEl=document.getElementById('inp-name');
  const qEl=document.getElementById('inp-qty');
  const pEl=document.getElementById('inp-price');
  const name=nEl.value.trim();
  const qty=parseInt(qEl.value);
  const price=parseFloat(pEl.value);
  if(!name){nEl.focus();return;}
  if(isNaN(qty)||qty<1){qEl.focus();qEl.value='1';return;}
  if(isNaN(price)||price<0){pEl.focus();return;}
  const now=new Date();
  items.unshift({
    id:Date.now(), name,
    qty: Math.max(1,qty),
    price,
    total: Math.round(qty*price*100)/100,
    cat: selCat||'other',
    time: now.toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'})
  });
  nEl.value=''; qEl.value='1'; pEl.value='';
  nEl.focus();
  lsSet(SK_ITEMS,items);
  renderList();
}

function deleteItem(id){items=items.filter(i=>i.id!==id);lsSet(SK_ITEMS,items);renderList();}

function clearAll(){
  if(!confirm('Сбросить текущий список?'))return;
  items=[];lsSet(SK_ITEMS,items);renderList();
}

/* ════════════════════════════════════════
   Render List
════════════════════════════════════════ */
function renderList(){
  const total=items.reduce((s,i)=>s+i.total,0);
  document.getElementById('total-val').textContent=total.toFixed(2);
  document.getElementById('total-count').textContent=
    items.length+' '+plural(items.length,'позиция','позиции','позиций');

  // budget
  const bw=document.getElementById('budget-wrap');
  const bcb=document.getElementById('budget-clear-btn');
  const badge=document.getElementById('budget-left-badge');
  if(budget){
    bw.style.display='block';bcb.style.display='';
    const pct=Math.min(total/budget*100,100);
    const bar=document.getElementById('budget-bar');
    bar.style.width=pct+'%';
    bar.style.background=pct>=100?'var(--danger)':pct>=80?'var(--orange)':'var(--green)';
    document.getElementById('budget-meta-text').textContent=total.toFixed(0)+' / '+budget.toFixed(0)+' ₴';
    const left=budget-total;
    badge.textContent=left>=0?'Осталось: '+left.toFixed(0)+' ₴':'Перерасход: '+Math.abs(left).toFixed(0)+' ₴';
    badge.style.color=left>=0?'var(--green)':'var(--danger)';
  }else{bw.style.display='none';bcb.style.display='none';badge.textContent='';}

  const listEl=document.getElementById('items-list');
  const labelEl=document.getElementById('list-label');
  const footerEl=document.getElementById('list-footer');

  if(!items.length){
    labelEl.style.display='none';footerEl.style.display='none';
    listEl.innerHTML='<div class="empty"><div class="empty-icon">🛒</div>Список пуст</div>';
    return;
  }
  labelEl.style.display='block';footerEl.style.display='flex';
  listEl.innerHTML=items.map(i=>`
    <div class="item-card">
      <div class="item-dot" style="background:${catColor(i.cat)}"></div>
      <div class="item-info">
        <div class="item-name">${esc(i.name)}</div>
        ${i.qty>1
          ? `<div class="item-sub">${i.qty} шт × ${i.price.toFixed(2)} ₴</div>`
          : `<div class="item-sub">${catShort(i.cat)}</div>`
        }
      </div>
      <div class="item-right">
        <div class="item-total">${i.total.toFixed(2)}<span class="item-cur">₴</span></div>
        ${i.qty>1 ? `<span class="item-cat-tag">${catShort(i.cat)}</span>` : ''}
      </div>
      <button class="btn-del" onclick="deleteItem(${i.id})">✕</button>
    </div>`).join('');
}

/* ════════════════════════════════════════
   Save modal
════════════════════════════════════════ */
function openSaveModal(){
  if(!items.length)return;
  const total=items.reduce((s,i)=>s+i.total,0);
  document.getElementById('modal-sub').textContent=
    items.length+' '+plural(items.length,'позиция','позиции','позиций')+' · '+total.toFixed(2)+' ₴';
  const now=new Date();
  document.getElementById('modal-label').value=
    now.toLocaleDateString('uk-UA',{day:'numeric',month:'long'});
  document.getElementById('modal-note').value='';
  document.getElementById('modal-bg').classList.add('open');
  setTimeout(()=>document.getElementById('modal-label').select(),200);
}
function closeModalDirect(){document.getElementById('modal-bg').classList.remove('open');}
function closeModal(e){if(e.target===document.getElementById('modal-bg'))closeModalDirect();}

async function saveReceipt(){
  const label=document.getElementById('modal-label').value.trim();
  if(!label){document.getElementById('modal-label').focus();return;}
  const note=document.getElementById('modal-note').value.trim();
  const now=new Date();
  const receipt={
    id: Date.now(),
    label,
    note: note||null,
    date: now.toLocaleDateString('uk-UA',{day:'numeric',month:'long',year:'numeric'}),
    total: items.reduce((s,i)=>s+i.total,0),
    items: [...items]
  };
  await dbAdd(receipt);
  items=[];lsSet(SK_ITEMS,items);
  closeModalDirect();
  renderList();
  showToast('✅ Чек сохранён в базу');
  switchTab('history');
}

/* ════════════════════════════════════════
   Render History
════════════════════════════════════════ */
async function renderHistory(){
  const receipts = await dbGetAll();
  const now = Date.now();
  const wk  = now-7*24*3600*1000;
  const mo  = now-30*24*3600*1000;
  const sumW=receipts.filter(r=>r.id>wk).reduce((s,r)=>s+r.total,0);
  const sumM=receipts.filter(r=>r.id>mo).reduce((s,r)=>s+r.total,0);

  document.getElementById('stats-row').innerHTML=`
    <div class="stat-card">
      <div class="stat-label">За 7 дней</div>
      <div class="stat-val">${sumW.toFixed(0)}<span style="font-size:14px;color:var(--muted)"> ₴</span></div>
      <div class="stat-sub">${receipts.filter(r=>r.id>wk).length} чеков</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">За 30 дней</div>
      <div class="stat-val">${sumM.toFixed(0)}<span style="font-size:14px;color:var(--muted)"> ₴</span></div>
      <div class="stat-sub">${receipts.filter(r=>r.id>mo).length} чеков</div>
    </div>`;

  // DB info
  document.getElementById('db-badge').textContent =
    `📦 IndexedDB · ${receipts.length} ${plural(receipts.length,'чек','чека','чеков')} сохранено`;

  const el=document.getElementById('history-list');
  if(!receipts.length){
    el.innerHTML='<div class="no-history"><div class="empty-icon">📋</div>Пока нет сохранённых чеков</div>';
    return;
  }
  el.innerHTML=receipts.map(r=>{
    // category breakdown
    const catTotals={};
    r.items.forEach(i=>{
      catTotals[i.cat]=(catTotals[i.cat]||0)+i.total;
    });
    const rTotal=r.total||1;
    const breakdown=Object.entries(catTotals).sort((a,b)=>b[1]-a[1]).map(([cid,val])=>`
      <div class="cat-row">
        <div class="cat-row-dot" style="background:${catColor(cid)}"></div>
        <div class="cat-row-name">${catShort(cid)}</div>
        <div class="cat-row-bar-bg">
          <div class="cat-row-bar" style="width:${(val/rTotal*100).toFixed(0)}%;background:${catColor(cid)}"></div>
        </div>
        <div class="cat-row-val">${val.toFixed(0)} ₴</div>
      </div>`).join('');

    return `
    <div class="receipt-card">
      <div class="receipt-head" onclick="toggleR(${r.id})">
        <div class="receipt-icon">🧾</div>
        <div class="receipt-info">
          <div class="receipt-name">${esc(r.label)}</div>
          <div class="receipt-meta">${r.date} · ${r.items.length} ${plural(r.items.length,'товар','товара','товаров')}</div>
        </div>
        <div class="receipt-total">${r.total.toFixed(2)} ₴</div>
        <div class="receipt-arrow" id="arr-${r.id}">▼</div>
      </div>
      <div class="receipt-body" id="rb-${r.id}">
        ${r.note?`<div class="receipt-note">📝 ${esc(r.note)}</div>`:''}
        ${r.items.map(i=>`
          <div class="r-item">
            <div class="r-dot" style="background:${catColor(i.cat)}"></div>
            <div class="r-info">
              <div class="r-name">${esc(i.name)}</div>
              ${i.qty>1?`<div class="r-qty-line">${i.qty} шт × ${i.price.toFixed(2)} ₴</div>`:''}
            </div>
            <span class="r-cat">${catShort(i.cat)}</span>
            <div class="r-price">${i.total.toFixed(2)}<span class="r-cur">₴</span></div>
          </div>`).join('')}
        <div class="cat-breakdown">
          <div class="cat-breakdown-title">По категориям</div>
          ${breakdown}
        </div>
        <div class="receipt-actions">
          <button class="btn-receipt-del" onclick="deleteReceipt(${r.id})">🗑 Удалить чек</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function toggleR(id){
  const b=document.getElementById('rb-'+id);
  const a=document.getElementById('arr-'+id);
  const o=b.classList.toggle('open');
  a.classList.toggle('open',o);
}

async function deleteReceipt(id){
  if(!confirm('Удалить этот чек?'))return;
  await dbDel(id);
  renderHistory();
}

/* ════════════════════════════════════════
   Export / Import JSON
════════════════════════════════════════ */
async function exportJSON(){
  const receipts=await dbGetAll();
  if(!receipts.length){showToast('Нечего экспортировать');return;}
  const data={version:1,exported:new Date().toISOString(),receipts};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='expenses_'+new Date().toLocaleDateString('uk-UA').replace(/\./g,'-')+'.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('✅ Экспорт выполнен');
}

async function importJSON(e){
  const file=e.target.files[0];
  if(!file)return;
  e.target.value='';
  try{
    const text=await file.text();
    const data=JSON.parse(text);
    const list=data.receipts||data; // support both formats
    if(!Array.isArray(list))throw new Error('bad format');
    let added=0;
    for(const r of list){
      if(!r.id||!r.label)continue;
      try{await dbPut(r);added++;}catch(err){}
    }
    showToast(`✅ Импортировано: ${added} чеков`);
    renderHistory();
  }catch(err){
    showToast('❌ Ошибка чтения файла');
  }
}

/* ════════════════════════════════════════
   Utils
════════════════════════════════════════ */
function plural(n,a,b,c){
  if(n===null||n===undefined)return c;
  const m=n%100;if(m>=11&&m<=14)return c;
  const e=n%10;if(e===1)return a;if(e>=2&&e<=4)return b;return c;
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

let toastTimer;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2200);
}

/* ════════════════════════════════════════
   Keyboard
════════════════════════════════════════ */
document.getElementById('inp-name').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('inp-qty').focus();});
document.getElementById('inp-qty').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('inp-price').focus();});
document.getElementById('inp-price').addEventListener('keydown',e=>{if(e.key==='Enter')addItem();});
document.getElementById('modal-label').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('modal-note').focus();});
document.getElementById('modal-note').addEventListener('keydown',e=>{if(e.key==='Enter')saveReceipt();});

   Init
════════════════════════════════════════ */
openDB().then(()=>{
  renderCats();
  if(budget) document.getElementById('budget-inp').placeholder='Бюджет: '+budget+' ₴';
  renderList();
}).catch(err=>{
  console.error('DB error:',err);
  showToast('⚠️ Ошибка базы данных');
});
