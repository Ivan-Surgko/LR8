<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080d14;
    --surface: rgba(255,255,255,0.03);
    --border: rgba(255,255,255,0.06);
    --border2: rgba(255,255,255,0.1);
    --text: #f1f5f9;
    --muted: #64748b;
    --muted2: #334155;
    --green: #4ade80;
    --yellow: #facc15;
    --orange: #fb923c;
    --red: #f87171;
    --purple: #a78bfa;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Manrope', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh;
    background-image: radial-gradient(ellipse at 15% 0%, rgba(74,222,128,0.05) 0%, transparent 55%),
                      radial-gradient(ellipse at 85% 100%, rgba(167,139,250,0.04) 0%, transparent 55%); }

  .app { max-width: 420px; margin: 0 auto; padding: 0 16px 60px; }

  /* TOP BAR */
  .topbar { display: flex; justify-content: space-between; align-items: center; padding: 22px 0 18px; }
  .topbar-left .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 3px; }
  .topbar-left .week { font-size: 17px; font-weight: 700; color: var(--text); }
  .topbar-right { display: flex; gap: 8px; }
  .icon-btn { background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    width: 38px; height: 38px; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; color: var(--muted); transition: all .15s; }
  .icon-btn:active { background: rgba(255,255,255,0.07); transform: scale(.95); }

  /* CARRY BADGE */
  .carry-badge { background: rgba(251,146,60,0.08); border: 1px solid rgba(251,146,60,0.2);
    border-radius: 8px; padding: 8px 12px; font-size: 13px; color: var(--orange); margin-bottom: 12px; }

  /* SUMMARY */
  .summary { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 14px; }
  .summary-top { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 4px; }
  .sum-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
  .big-num { font-family: var(--mono); font-size: 42px; font-weight: 800; color: var(--text); line-height: 1; }
  .big-num span { font-size: 22px; color: var(--muted); }
  .to-receive { font-size: 15px; font-weight: 700; color: var(--green); font-family: var(--mono); }
  .advance-sub { font-size: 12px; color: var(--purple); margin-bottom: 2px; }
  .divider { height: 1px; background: var(--border); margin: 12px 0; }
  .mini-stats { display: flex; gap: 18px; flex-wrap: wrap; }
  .mini-stat .ms-lbl { font-size: 11px; color: var(--muted2); margin-bottom: 2px; }
  .mini-stat .ms-val { font-family: var(--mono); font-size: 15px; font-weight: 600; }

  /* BUTTONS GRID */
  .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  .action-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px; cursor: pointer; display: flex; align-items: center; gap: 10px; text-align: left;
    transition: background .12s, transform .1s; }
  .action-card:active { background: rgba(255,255,255,0.06); transform: scale(.97); }
  .action-card .ac-icon { font-size: 20px; width: 26px; flex-shrink: 0; }
  .action-card .ac-name { font-size: 13px; font-weight: 600; color: var(--text); }
  .action-card .ac-sub { font-size: 11px; color: var(--muted2); margin-top: 1px; }

  /* CARRY BTN */
  .carry-btn { width: 100%; background: rgba(251,146,60,0.07); border: 1px solid rgba(251,146,60,0.2);
    border-radius: 10px; padding: 10px; color: var(--orange); font-size: 13px; cursor: pointer;

  .entries { display: flex; flex-direction: column; gap: 5px; }

<script>
const STORAGE_KEY = 'salary_v2';
let data = loadData();
let currentModal = null;
let pendingDelete = null;
let detailWeekId = null;
let customWeekLabels = {};

// Восстанавливаем кастомные метки
try {
  const saved = localStorage.getItem('salary_custom_week_labels');
  if (saved) customWeekLabels = JSON.parse(saved);
} catch {}

function saveCustomWeekLabels() {
  try { localStorage.setItem('salary_custom_week_labels', JSON.stringify(customWeekLabels)); } catch {}
}

// ── DATA ──────────────────────────────────────────────────────────────────────

function loadData() {
  try {
    const s = localStorage.getItem(STORAGE_KEY);
    return s ? JSON.parse(s) : { weeks: {} };
  } catch { return { weeks: {} }; }
}

function saveData() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch {}
}

// ISO 8601: получаем дату понедельника для недели
function getMondayOfWeek(wid) {
  const [y, wPart] = wid.split('-W');
  const w = parseInt(wPart);
  // 4 января всегда в первой неделе ISO
  const jan4 = new Date(Date.UTC(parseInt(y), 0, 4));
  const jan4Day = jan4.getUTCDay() || 7; // Пн=1 ... Вс=7
  const firstMonday = new Date(jan4);
  firstMonday.setUTCDate(jan4.getUTCDate() - (jan4Day - 1));
  const monday = new Date(firstMonday);
  monday.setUTCDate(firstMonday.getUTCDate() + (w - 1) * 7);
  return monday;
}

function getWeekId(date) {
  const d = date ? new Date(date) : new Date();
  // Приводим к UTC для расчёта ISO недели
  const utc = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = utc.getUTCDay() || 7;
  utc.setUTCDate(utc.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(utc.getUTCFullYear(), 0, 1));
  const weekNo = Math.ceil((((utc - yearStart) / 86400000) + 1) / 7);
  return utc.getUTCFullYear() + '-W' + String(weekNo).padStart(2, '0');
}

function getWeekLabel(wid) {
  if (customWeekLabels[wid]) return customWeekLabels[wid];

  const monday = getMondayOfWeek(wid);
  const sunday = new Date(monday);
  sunday.setUTCDate(monday.getUTCDate() + 6);

  const f = d => {
    const day = String(d.getUTCDate()).padStart(2, '0');
    const month = String(d.getUTCMonth() + 1).padStart(2, '0');
    return day + '.' + month;
  };
  return f(monday) + ' — ' + f(sunday) + '.' + String(sunday.getUTCFullYear()).slice(2);
}

function editWeekDates() {
  const row = document.getElementById('date-edit-row');
  if (row.style.display === 'none' || !row.style.display) {
    row.style.display = 'flex';
    const monday = getMondayOfWeek(detailWeekId);
    const sunday = new Date(monday);
    sunday.setUTCDate(monday.getUTCDate() + 6);
    const toInput = d => d.toISOString().split('T')[0];
    document.getElementById('edit-date-start').value = toInput(monday);
    document.getElementById('edit-date-end').value = toInput(sunday);
  } else {
    row.style.display = 'none';
  }
}

function saveWeekDates() {
  const startVal = document.getElementById('edit-date-start').value;
  const endVal = document.getElementById('edit-date-end').value;
  if (!startVal || !endVal) { showToast('Выбери обе даты'); return; }
  const start = new Date(startVal);
  const end = new Date(endVal);
  if (end < start) { showToast('Конец раньше начала'); return; }
  const f = d => {
    const day = String(d.getDate()).padStart(2, '0');
    const month = String(d.getMonth() + 1).padStart(2, '0');
    return day + '.' + month;
  };
  const label = f(start) + ' — ' + f(end) + '.' + String(end.getFullYear()).slice(2);
  customWeekLabels[detailWeekId] = label;
  saveCustomWeekLabels();
  document.getElementById('date-edit-row').style.display = 'none';
  renderWeekDetail(detailWeekId);
  renderHistory();
  showToast('Даты обновлены');
}

function calcTotals(week) {
  if (!week) return { earned:0, overtime:0, deductions:0, advance:0, overtimeHours:0, remainingHours:0 };
  let earned = 0, overtimeHours = week.overtimeCarry || 0, deductions = 0, advance = 0;
  for (const e of week.entries || []) {
    if (e.type === 'workday') earned += 650;
    if (e.type === 'short' || e.type === 'overtime') overtimeHours += e.hours;
    if (e.type === 'deduction') deductions += e.amount;
    if (e.type === 'advance') advance += e.amount;
  }
  const blocks = Math.floor(overtimeHours / 4);
  const overtimePay = blocks * 300;
  const remainingHours = +(overtimeHours - blocks * 4).toFixed(2);
  return { earned, overtime: overtimePay, deductions, advance, overtimeHours, remainingHours,
           total: earned + overtimePay - deductions };
}

function currentWeekId() { return getWeekId(); }

function getWeek(wid) {
  if (!data.weeks[wid]) data.weeks[wid] = { entries: [], overtimeCarry: 0 };
  return data.weeks[wid];
}

function addEntry(wid, entry) {
  const wk = getWeek(wid);
  wk.entries.push({ ...entry, id: Date.now() });
  saveData();
  renderMain();
}

function removeEntry(wid, id) {
  const wk = data.weeks[wid];
  if (!wk) return;
  wk.entries = wk.entries.filter(e => e.id !== id);
  saveData();
}

// ── TYPE STYLES ───────────────────────────────────────────────────────────────

const TS = {
  workday:   { icon:'✓', color:'var(--green)',  bg:'rgba(74,222,128,0.07)' },
  short:     { icon:'◑', color:'var(--yellow)', bg:'rgba(250,204,21,0.07)' },
  overtime:  { icon:'⊕', color:'var(--orange)', bg:'rgba(251,146,60,0.07)' },
  dayoff:    { icon:'○', color:'var(--muted)',  bg:'rgba(100,116,139,0.06)' },
  deduction: { icon:'↓', color:'var(--red)',    bg:'rgba(248,113,113,0.07)' },
  advance:   { icon:'↑', color:'var(--purple)', bg:'rgba(167,139,250,0.07)' },
};

// ── ACTIONS ───────────────────────────────────────────────────────────────────

function addWorkday() {
  addEntry(currentWeekId(), { type:'workday', label:'Рабочий день +650₴' });
  showToast('+650₴ зачислено');
}

function addDayOff() {
  addEntry(currentWeekId(), { type:'dayoff', label:'Выходной' });
  showToast('Выходной отмечен');
}

function carryOvertime() {
  const wid = currentWeekId();
  const t = calcTotals(data.weeks[wid]);
  if (!t.remainingHours) return;
  const nextWid = getNextWeekId(wid);
  const nw = getWeek(nextWid);
  nw.overtimeCarry = +(( nw.overtimeCarry || 0) + t.remainingHours).toFixed(2);
  saveData();
  renderMain();
  showToast(t.remainingHours + 'г перенесено на следующую неделю');
}

function getNextWeekId(wid) {
  const monday = getMondayOfWeek(wid);
  monday.setUTCDate(monday.getUTCDate() + 7);
  return getWeekId(monday);
}

// ── MODAL ─────────────────────────────────────────────────────────────────────

const MODAL_CFG = {
  short:     { title:'Неполный день', sub:'Сколько часов отработал? (1–7.5)\nОни пойдут в копилку переработки' },
  overtime:  { title:'Переработка', sub:'Сколько часов сверхурочно?\n4г = 300₴ · 8г = 600₴' },
  deduction: { title:'Вычет', sub:'Сумма вычета (₴)' },
  advance:   { title:'Аванс', sub:'Сколько получил авансом (₴)?' },
};

function openModal(type) {
  currentModal = type;
  const cfg = MODAL_CFG[type];
  document.getElementById('modal-title').textContent = cfg.title;
  document.getElementById('modal-sub').textContent = cfg.sub;
  document.getElementById('modal-input').value = '';
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(() => document.getElementById('modal-input').focus(), 300);
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  currentModal = null;
}

function modalConfirm() {
  const val = parseFloat(document.getElementById('modal-input').value);
  const wid = currentWeekId();
  if (currentModal === 'short') {
    if (!val || val <= 0 || val >= 8) { showToast('Введи часы от 0.5 до 7.5'); return; }
    addEntry(wid, { type:'short', hours: val, label:`Неполный день ${val}г` });
    showToast(`+${val}г в копилку`);
  }
  if (currentModal === 'overtime') {
    if (!val || val <= 0) { showToast('Введи количество часов'); return; }
    addEntry(wid, { type:'overtime', hours: val, label:`Переработка +${val}г` });
    showToast(`+${val}г в копилку`);
  }
  if (currentModal === 'deduction') {
    if (!val || val <= 0) { showToast('Введи сумму'); return; }
    addEntry(wid, { type:'deduction', amount: val, label:`Вычет −${val}₴` });
    showToast(`−${val}₴ вычет`);
  }
  if (currentModal === 'advance') {
    if (!val || val <= 0) { showToast('Введи сумму'); return; }
    addEntry(wid, { type:'advance', amount: val, label:`Аванс +${val}₴` });
    showToast(`Аванс ${val}₴ зафиксирован`);
  }
  closeModal();
}

// ── DELETE ────────────────────────────────────────────────────────────────────

function askDelete(wid, id, label) {
  pendingDelete = { wid, id };
  document.getElementById('del-sub').textContent = label;
  document.getElementById('del-overlay').classList.add('open');
}

function confirmDelete() {
  if (!pendingDelete) return;
  removeEntry(pendingDelete.wid, pendingDelete.id);
  closeDelModal();
  if (detailWeekId) renderWeekDetail(detailWeekId);
  else renderMain();
  showToast('Удалено');
}

function closeDelModal() {
  document.getElementById('del-overlay').classList.remove('open');
  pendingDelete = null;
}

// ── PAGES ─────────────────────────────────────────────────────────────────────

function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  if (name === 'main') renderMain();
  if (name === 'history') renderHistory();
}

// ── RENDER MAIN ───────────────────────────────────────────────────────────────

function renderMain() {
  const wid = currentWeekId();
  const wk = data.weeks[wid] || { entries: [], overtimeCarry: 0 };
  const t = calcTotals(wk);

  document.getElementById('main-week-label').textContent = getWeekLabel(wid);

  // carry
  const carryBadge = document.getElementById('carry-badge');
  if (wk.overtimeCarry > 0) {
    carryBadge.textContent = '↩ Перенесено с прошлой недели: ' + wk.overtimeCarry + 'г';
    carryBadge.style.display = 'block';
  } else carryBadge.style.display = 'none';

  const net = t.earned + t.overtime - t.deductions;
  document.getElementById('main-total').textContent = net;

  // advance block
  const advBlock = document.getElementById('advance-block');
  if (t.advance > 0) {
    advBlock.style.display = 'block';
    document.getElementById('advance-sub-text').textContent = 'аванс −' + t.advance + '₴';
    document.getElementById('to-receive-text').textContent = '= ' + (net - t.advance) + '₴';
  } else advBlock.style.display = 'none';

  // mini stats
  document.getElementById('ms-days').textContent = (wk.entries||[]).filter(e=>e.type==='workday').length + ' дн';
  document.getElementById('ms-ot').textContent = t.overtime + '₴';
  document.getElementById('ms-rem').textContent = t.remainingHours + 'г';
  if (t.deductions > 0) {
    document.getElementById('ms-ded-block').style.display = '';
    document.getElementById('ms-ded').textContent = '−' + t.deductions + '₴';
  } else document.getElementById('ms-ded-block').style.display = 'none';

  // carry button
  const carryBtn = document.getElementById('carry-btn');
  if (t.remainingHours > 0) {
    carryBtn.textContent = 'Перенести ' + t.remainingHours + 'г на следующую неделю →';
    carryBtn.style.display = 'block';
  } else carryBtn.style.display = 'none';

  // recent entries
  const entries = wk.entries || [];
  const recentBlock = document.getElementById('recent-block');
  const recentList = document.getElementById('recent-list');
  if (entries.length > 0) {
    recentBlock.style.display = 'block';
    const recent = [...entries].reverse().slice(0, 6);
    recentList.innerHTML = recent.map(e => entryHTML(wid, e)).join('');
  } else {
    recentBlock.style.display = 'none';
    recentList.innerHTML = '';
  }
}

function entryHTML(wid, e) {
  const ts = TS[e.type] || { icon:'?', color:'var(--muted)', bg:'rgba(255,255,255,0.03)' };
  return `<div class="entry-row" style="background:${ts.bg}">
    <span class="e-icon" style="color:${ts.color}">${ts.icon}</span>
    <span class="e-label">${e.label}</span>
    <button class="del-btn" onclick="askDelete('${wid}', ${e.id}, '${e.label.replace(/'/g,"\\'")}')">✕</button>
  </div>`;
}

// ── RENDER HISTORY ────────────────────────────────────────────────────────────

function renderHistory() {
  const cards = document.getElementById('hist-cards');
  const wids = Object.keys(data.weeks).sort((a,b) => b.localeCompare(a));
  if (wids.length === 0) { cards.innerHTML = '<div class="empty">Нет записей</div>'; return; }
  const cwid = currentWeekId();
  cards.innerHTML = wids.map(wid => {
    const wk = data.weeks[wid];
    const t = calcTotals(wk);
    const isCur = wid === cwid;
    const typesSet = [...new Set((wk.entries||[]).map(e=>e.type))];
    const net = t.earned + t.overtime - t.deductions;
    return `<div class="hist-card ${isCur?'current':''}" onclick="openWeekDetail('${wid}')">
      <div class="hist-card-top">
        <div>
          <div class="hist-wlbl">${getWeekLabel(wid)}</div>
          ${isCur ? '<span class="hist-badge">текущая</span>' : ''}
        </div>
        <div>
          <div class="hist-amount" style="color:var(--text)">${net}₴</div>
          ${t.advance>0 ? `<div class="hist-adv">аванс −${t.advance}₴</div>` : ''}
        </div>
      </div>
      <div class="hist-types">
        ${typesSet.map(tp => `<span class="hist-type-dot" style="color:${(TS[tp]||{}).color||'var(--muted)'}">
          ${(TS[tp]||{}).icon||'?'} ${(wk.entries||[]).filter(e=>e.type===tp).length}</span>`).join('')}
        ${(wk.overtimeCarry||0)>0 ? `<span class="hist-type-dot" style="color:var(--orange)">↩ ${wk.overtimeCarry}г</span>` : ''}
      </div>
    </div>`;
  }).join('');
}

// ── WEEK DETAIL ───────────────────────────────────────────────────────────────

function openWeekDetail(wid) {
  detailWeekId = wid;
  document.getElementById('date-edit-row').style.display = 'none';
  renderWeekDetail(wid);
  showPage('week');
}

function renderWeekDetail(wid) {
  const wk = data.weeks[wid] || { entries:[], overtimeCarry:0 };
  const t = calcTotals(wk);
  const net = t.earned + t.overtime - t.deductions;

  document.getElementById('wd-title').textContent = getWeekLabel(wid);

  const cb = document.getElementById('wd-carry-badge');
  if ((wk.overtimeCarry||0) > 0) {
    cb.textContent = '↩ Перенесено с прошлой недели: ' + wk.overtimeCarry + 'г';
    cb.style.display = 'block';
  } else cb.style.display = 'none';

  // summary
  let rows = `<div class="wd-row"><span class="wd-row-lbl">Рабочих дней</span><span class="wd-row-val" style="color:var(--green)">${(wk.entries||[]).filter(e=>e.type==='workday').length} × 650₴</span></div>`;
  rows += `<div class="wd-row"><span class="wd-row-lbl">Переработка</span><span class="wd-row-val" style="color:var(--orange)">${t.overtime}₴</span></div>`;
  if (t.deductions > 0) rows += `<div class="wd-row"><span class="wd-row-lbl">Вычеты</span><span class="wd-row-val" style="color:var(--red)">−${t.deductions}₴</span></div>`;
  if (t.advance > 0) rows += `<div class="wd-row"><span class="wd-row-lbl">Аванс</span><span class="wd-row-val" style="color:var(--purple)">${t.advance}₴</span></div>`;
  rows += `<div class="divider"></div>`;
  rows += `<div class="wd-row big"><span class="wd-row-lbl">Заработано</span><span class="wd-row-val" style="color:var(--text)">${net}₴</span></div>`;
  if (t.advance > 0) rows += `<div class="wd-row big"><span class="wd-row-lbl">К получению</span><span class="wd-row-val" style="color:var(--green)">${net - t.advance}₴</span></div>`;
  if (t.remainingHours > 0) rows += `<div style="font-size:12px;color:var(--muted2);margin-top:4px">↩ Остаток переработки: ${t.remainingHours}г</div>`;
  document.getElementById('wd-summary').innerHTML = rows;

  // entries
  const entries = wk.entries || [];
  document.getElementById('wd-entries').innerHTML = entries.length === 0
    ? '<div class="empty">Нет записей</div>'
    : [...entries].reverse().map(e => entryHTML(wid, e)).join('');
}

// ── EXPORT / IMPORT ───────────────────────────────────────────────────────────

function exportData() {
  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const today = new Date();
  const d = String(today.getDate()).padStart(2,'0');
  const m = String(today.getMonth()+1).padStart(2,'0');
  const y = today.getFullYear();
  a.href = url;
  a.download = `зарплата_${d}-${m}-${y}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('Данные экспортированы');
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const imported = JSON.parse(e.target.result);
      if (!imported.weeks) { showToast('Неверный формат файла'); return; }
      data.weeks = { ...data.weeks, ...imported.weeks };
      saveData();
      renderHistory();
      showToast('Данные загружены ✓');
    } catch { showToast('Ошибка чтения файла'); }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ── TOAST ─────────────────────────────────────────────────────────────────────

let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

// ── INIT ──────────────────────────────────────────────────────────────────────

renderMain();
</script>
</body>
</html>
